name: server
description: Terenzo HTTP server on Relic and PostgreSQL that runs the same domain rules as the clients.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  contract: any
  dart_jsonwebtoken: 3.4.1
  domain: any
  hashlib: 2.4.2
  mapping: any
  pool: 1.5.3
  postgres: 3.5.18
  relic: 1.2.0

dev_dependencies:
  http: 1.6.0
  lints: ^6.0.0
  test: ^1.25.6
