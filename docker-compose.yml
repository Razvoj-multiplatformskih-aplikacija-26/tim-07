# Baza i server jednom komandom (iz korena repozitorijuma):
#
#   cp .env.example .env
#   docker compose up --build
#
# Sve vrednosti dolaze iz .env; port servera je SERVER_PORT (8080).

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # U mreži Compose-a baza je servis "db" na svom unutrašnjem portu.
      DB_HOST: db
      DB_PORT: "3306"
      SERVER_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
