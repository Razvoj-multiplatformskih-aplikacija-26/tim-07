services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Copy .env.example to .env first}
      MYSQL_USER: ${DB_USER:?Copy .env.example to .env first}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Copy .env.example to .env first}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DB_PORT:?Copy .env.example to .env first}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      SERVER_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:?Copy .env.example to .env first}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
